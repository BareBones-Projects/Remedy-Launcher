name: Signed managed-install checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run manage -- status
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --pack-destination .
      - run: sha256sum remedy-launcher-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: remedy-launcher-source-unsigned
          path: |
            remedy-launcher-*.tgz
            SHA256SUMS
