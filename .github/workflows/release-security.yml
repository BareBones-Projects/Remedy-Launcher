name: Remedy Launcher source package and integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify source and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: node tests/docs-integrity.test.js
  source-package:
    name: Build unsigned source tarball and checksum
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce source archive and checksum (NOT a native installer)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf '{"package":"remedy-launcher","source_sha":"%s","distribution":"unsigned source CLI only; not native installer or malware-safety assertion"}\n' "$GITHUB_SHA" > dist/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: remedy-launcher-unsigned-source
          path: dist/
