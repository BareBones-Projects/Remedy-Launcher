name: Documentation integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify documentation links and catalog consistency
        run: node tests/docs-integrity.test.js
      - name: JavaScript syntax checks
        run: npm run check
